listenAddress: "127.0.0.1:9080"
httpListenAddress: "127.0.0.1:9081"
pacListenAddress: "127.0.0.1:9082"
# the ssh proxy is off unless sshListenAddress is set, e.g. "127.0.0.1:9083"
sshListenAddress: ""
sshHostKeyFile: "~/.podproxy/ssh_host_ed25519_key"
sshAuthorizedKeys:
  - "~/.ssh/*.pub"
skipDefaultKubeconfig: false
skipKubeconfigEnv: false

kubeconfigs:
  - "~/.kube/configs/*.yml"
  - "~/.kube/configs/*.yaml"
  - "~/.kube/conf/*.yml"
  - "~/.kube/conf/*.yaml"

log:
  level: info
  file: ""
  formatter: text
  colors: false
  timestamp: false
